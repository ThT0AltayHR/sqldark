[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqldark"
version = "0.1.1"
description = "SQLDark - Advanced SQL Injection & Database Takeover Framework"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Muhammed Balin" }]
keywords = ["sql injection", "sqli", "pentest", "security", "sqlmap", "waf bypass"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "requests>=2.25",
]

[project.optional-dependencies]
socks = ["requests[socks]"]

[project.urls]
Homepage = "https://sdark.gt.tc"
Source = "https://github.com/ThT0AltayHR/sqldark"
"Bug Tracker" = "https://github.com/ThT0AltayHR/sqldark/issues"

[project.scripts]
sqldark = "sqldark.cli:main"

[tool.setuptools.packages.find]
include = ["sqldark*"]

[tool.setuptools.package-data]
sqldark = [
    "data/**/*.json",
    "data/**/*.txt",
    "waf/*.json",
    "waf/signatures/*.json",
    "tamper/scripts/*.py",
]
